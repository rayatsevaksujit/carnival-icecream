<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carnival Ice Cream — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700;800&family=Rozha+One&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Mukta,sans-serif;background:#fff5f7;color:#252525}
body{max-width:430px;margin:auto;background:linear-gradient(160deg,#fff7fa,#fff0f4);min-height:100vh}
.wrap{padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
.brand{font-family:'Rozha One',serif;font-size:30px;line-height:1;color:#fff}
.head{background:linear-gradient(135deg,#e11d48,#ec4899,#f59e0b);border-radius:0 0 28px 28px;padding:22px 18px 20px;box-shadow:0 10px 28px #e11d4825}
.card{background:#fff;border:1px solid #fce7f3;border-radius:24px;padding:16px;margin-top:14px;box-shadow:0 8px 24px #9f123912}
input,select{width:100%;padding:12px 13px;border:1px solid #e5e7eb;border-radius:14px;background:#fafafa;font:inherit;margin-top:8px;outline:none}
button{border:0;border-radius:15px;padding:12px 14px;font:700 14px Mukta,sans-serif;cursor:pointer}
.primary{width:100%;background:#e11d48;color:#fff;margin-top:12px}.secondary{background:#f3f4f6;color:#4b5563}
.hidden{display:none!important}.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;background:#fafafa;border:1px solid #f1f5f9;border-radius:16px;margin-top:8px}
.item span{font-size:13px;font-weight:700;line-height:1.25}.del{background:#ffe4e6;color:#e11d48;padding:8px 10px;font-size:12px}
.note{font-size:11px;color:#6b7280;line-height:1.5}.back{display:block;text-align:center;margin-top:14px;color:#e11d48;text-decoration:none;font-weight:800;font-size:13px}
</style>
</head>
<body>
<div id="login" class="wrap">
  <div class="head"><div class="brand">Carnival Ice Cream</div><div style="color:#ffe4e6;font-weight:700;margin-top:5px">🔐 व्यवस्थापक विभाग</div></div>
  <div class="card">
    <h2 style="margin:0 0 4px">Admin Login</h2>
    <p class="note">साधा Admin Login. Firebase फक्त Menu आणि फोटो साठवण्यासाठी वापरले आहे.</p>
    <input id="pass" type="password" placeholder="Admin पासवर्ड" autocomplete="current-password">
    <button class="primary" onclick="login()">लॉगइन करा</button>
    <p id="login-msg" class="note" style="color:#e11d48;text-align:center;margin-bottom:0"></p>
  </div>
  <a class="back" href="./">← ग्राहक मेनूकडे जा</a>
</div>
<div id="panel" class="wrap hidden">
  <div class="head"><div class="brand">Carnival Ice Cream</div><div style="color:#fff1f2;font-weight:700;margin-top:5px">⚙️ Menu Management</div></div>
  <div class="card">
    <h2 style="margin:0">नवीन पदार्थ जोडा 🍨</h2>
    <input id="name" placeholder="पदार्थाचे नाव">
    <select id="cat"><option>आईस्क्रीम</option><option>मिल्कशेख</option><option>लस्सी</option><option>सोडा/कोल्डड्रिंक्स</option></select>
    <input id="price" type="number" min="1" placeholder="किंमत ₹">
    <input id="img" type="file" accept="image/*">
    <p class="note">फोटो दिल्यास तो Firebase Storage मध्ये जाईल.</p>
    <button class="primary" id="add-btn" onclick="addProduct()">मेनूमध्ये जोडा</button>
  </div>
  <div class="card"><h3 style="margin:0 0 6px">सध्याचे पदार्थ</h3><div id="list"></div></div>
  <button class="secondary" style="width:100%;margin-top:14px" onclick="logout()">लॉगआउट</button>
  <a class="back" href="./">← ग्राहक मेनूकडे जा</a>
</div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyD6v_dLIM5rBnBYmQL2rYMUH5v5686KKew",authDomain:"carnival-ice-cream.firebaseapp.com",projectId:"carnival-ice-cream",storageBucket:"carnival-ice-cream.firebasestorage.app",messagingSenderId:"865814345062",appId:"1:865814345062:web:b9483f4e3540ae4f6744a7",measurementId:"G-7HJJPNH63E"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore(),storage=firebase.storage(),ADMIN_PASSWORD="1234";
const defaultImg="https://images.unsplash.com/photo-1563805042-7684c019e1cb?auto=format&fit=crop&w=600&q=80";
let unsubscribe=null;
function login(){if(document.getElementById('pass').value===ADMIN_PASSWORD){sessionStorage.setItem('carnival_admin','1');showPanel()}else document.getElementById('login-msg').textContent='❌ पासवर्ड चुकीचा आहे.'}
function logout(){sessionStorage.removeItem('carnival_admin');if(unsubscribe)unsubscribe();showLogin()}
function showLogin(){document.getElementById('login').classList.remove('hidden');document.getElementById('panel').classList.add('hidden');document.getElementById('pass').value=''}
function showPanel(){document.getElementById('login').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');listenProducts()}
function friendly(e){return e&&e.code==='permission-denied'?'Firebase Rules मुळे परवानगी मिळाली नाही.':(e&&e.message)||'काहीतरी चूक झाली.'}
function listenProducts(){if(unsubscribe)unsubscribe();unsubscribe=db.collection('products').orderBy('createdAt','asc').onSnapshot(s=>render(s.docs.map(d=>({id:d.id,...d.data()}))),e=>{document.getElementById('list').innerHTML='<p class="note" style="color:#e11d48">मेनू वाचता आला नाही: '+friendly(e)+'</p>'})}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function render(products){document.getElementById('list').innerHTML=products.length?products.map(p=>'<div class="item"><div style="display:flex;align-items:center;gap:10px;min-width:0"><img src="'+esc(p.img||defaultImg)+'" style="width:46px;height:46px;object-fit:cover;border-radius:12px;background:#fce7f3"><span>'+esc(p.name)+'<br><small style="color:#e11d48">₹'+Number(p.price||0)+' · '+esc(p.category)+'</small></span></div><button class="del" onclick="delProduct(\''+esc(p.id)+'\')">काढा</button></div>').join(''):'<p class="note">मेनूमध्ये अजून पदार्थ नाहीत.</p>'}
async function delProduct(id){if(!confirm('हा पदार्थ कायमचा काढायचा आहे का?'))return;try{await db.collection('products').doc(id).delete();alert('पदार्थ काढला.')}catch(e){alert('पदार्थ काढता आला नाही: '+friendly(e))}}
async function compressImage(file){
 if(!file||file.size<=5*1024*1024)return file;
 const url=URL.createObjectURL(file);
 try{
  const img=new Image();
  await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});
  let maxSide=2600,w=img.naturalWidth,h=img.naturalHeight;
  if(Math.max(w,h)>maxSide){const scale=maxSide/Math.max(w,h);w=Math.round(w*scale);h=Math.round(h*scale)}
  const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');
  let blob=null,quality=.9;
  for(let pass=0;pass<12;pass++){
   canvas.width=w;canvas.height=h;ctx.clearRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
   blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',quality));
   if(blob&&blob.size<=4.7*1024*1024)break;
   if(quality>.5)quality-=.06;else{w=Math.max(900,Math.round(w*.82));h=Math.max(900,Math.round(h*.82))}
  }
  if(!blob||blob.size>5*1024*1024)throw new Error('फोटो 5 MB च्या आत करता आला नाही.');
  return new File([blob],file.name.replace(/\\.[^.]+$/,'')+'.jpg',{type:'image/jpeg',lastModified:Date.now()});
 }finally{URL.revokeObjectURL(url)}
}
async function addProduct(){
 const name=document.getElementById('name').value.trim(),cat=document.getElementById('cat').value,price=Number(document.getElementById('price').value),file=document.getElementById('img').files[0],btn=document.getElementById('add-btn');
 if(!name||!price){alert('नाव आणि किंमत भरा.');return}
 btn.disabled=true;btn.textContent=file&&file.size>5*1024*1024?'फोटोची साईज कमी करत आहे...':'जोडत आहे...';
 try{
  let img=defaultImg,uploadFile=file;
  if(file){uploadFile=await compressImage(file);const safe=uploadFile.name.replace(/[^a-zA-Z0-9._-]/g,'_'),ref=storage.ref('products/'+Date.now()+'_'+safe),up=await ref.put(uploadFile);img=await up.ref.getDownloadURL()}
  await db.collection('products').add({name,category:cat,price,img,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
  document.getElementById('name').value='';document.getElementById('price').value='';document.getElementById('img').value='';
  alert('✅ पदार्थ Firebase मेनूमध्ये जोडला.')
 }catch(e){alert('पदार्थ जोडता आला नाही: '+friendly(e))}finally{btn.disabled=false;btn.textContent='मेनूमध्ये जोडा'}
}
if(sessionStorage.getItem('carnival_admin')==='1')showPanel();else showLogin();
</script>
</body>
</html>
