<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carnival Ice Cream — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700;800&family=Rozha+One&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Mukta,sans-serif;background:#fff5f7;color:#252525}
body{max-width:430px;margin:auto;background:linear-gradient(160deg,#fff7fa,#fff0f4);min-height:100vh}
.wrap{padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
.brand{font-family:'Rozha One',serif;font-size:30px;line-height:1;color:#fff}
.head{background:linear-gradient(135deg,#e11d48,#ec4899,#f59e0b);border-radius:0 0 28px 28px;padding:22px 18px 20px;box-shadow:0 10px 28px #e11d4825}
.card{background:#fff;border:1px solid #fce7f3;border-radius:24px;padding:16px;margin-top:14px;box-shadow:0 8px 24px #9f123912}
input,select{width:100%;padding:12px 13px;border:1px solid #e5e7eb;border-radius:14px;background:#fafafa;font:inherit;margin-top:8px;outline:none}
input:focus,select:focus{border-color:#fb7185;box-shadow:0 0 0 3px #fb718522}
button{border:0;border-radius:15px;padding:12px 14px;font:700 14px Mukta,sans-serif;cursor:pointer}
.primary{width:100%;background:#e11d48;color:#fff;margin-top:12px}
.secondary{background:#f3f4f6;color:#4b5563}
.hidden{display:none!important}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;background:#fafafa;border:1px solid #f1f5f9;border-radius:16px;margin-top:8px}
.item span{font-size:13px;font-weight:700;line-height:1.25}
.del{background:#ffe4e6;color:#e11d48;padding:8px 10px;font-size:12px}
.note{font-size:11px;color:#6b7280;line-height:1.5}
.back{display:block;text-align:center;margin-top:14px;color:#e11d48;text-decoration:none;font-weight:800;font-size:13px}
</style>
</head>
<body>
<div id="login" class="wrap">
  <div class="head">
    <div class="brand">Carnival Ice Cream</div>
    <div style="color:#ffe4e6;font-weight:700;margin-top:5px">🔐 व्यवस्थापक विभाग</div>
  </div>
  <div class="card">
    <h2 style="margin:0 0 4px">Admin Login</h2>
    <p class="note">ही लिंक ग्राहकांच्या मुख्य पेजवर दाखवलेली नाही.</p>
    <input id="pass" type="password" placeholder="Admin पासवर्ड">
    <button class="primary" onclick="login()">लॉगइन करा</button>
  </div>
  <a class="back" href="./">← ग्राहक मेनूकडे जा</a>
</div>

<div id="panel" class="wrap hidden">
  <div class="head">
    <div class="brand">Carnival Ice Cream</div>
    <div style="color:#fff1f2;font-weight:700;margin-top:5px">⚙️ Menu Management</div>
  </div>
  <div class="card">
    <h2 style="margin:0">नवीन पदार्थ जोडा 🍨</h2>
    <input id="name" placeholder="पदार्थाचे नाव">
    <select id="cat">
      <option>आईस्क्रीम</option><option>मिल्कशेख</option><option>लस्सी</option><option>सोडा/कोल्डड्रिंक्स</option>
    </select>
    <input id="price" type="number" min="1" placeholder="किंमत ₹">
    <input id="img" type="file" accept="image/*">
    <button class="primary" onclick="addProduct()">मेनूमध्ये जोडा</button>
  </div>
  <div class="card">
    <h3 style="margin:0 0 6px">सध्याचे पदार्थ</h3>
    <div id="list"></div>
  </div>
  <button class="secondary" style="width:100%;margin-top:14px" onclick="logout()">लॉगआउट</button>
  <a class="back" href="./">← ग्राहक मेनूकडे जा</a>
</div>

<script>
const defaultProducts=[
{name:'रॉकी रोड स्कूप',category:'आईस्क्रीम',price:80,img:'https://images.unsplash.com/photo-1563805042-7684c019e1cb?auto=format&fit=crop&w=600&q=80'},
{name:'चॉकलेट संडे',category:'आईस्क्रीम',price:120,img:'https://images.unsplash.com/photo-1557142046-c705a3adf35e?auto=format&fit=crop&w=600&q=80'},
{name:'रोझ मिल्कशेख',category:'मिल्कशेख',price:90,img:'https://images.unsplash.com/photo-1572490122747-3968b75cc699?auto=format&fit=crop&w=600&q=80'},
{name:'शाही मलाई लस्सी',category:'लस्सी',price:60,img:'https://images.unsplash.com/photo-1541658016709-82535e94bc69?auto=format&fit=crop&w=600&q=80'},
{name:'मँगो स्पेशल लस्सी',category:'लस्सी',price:75,img:'https://images.unsplash.com/photo-1541658016709-82535e94bc69?auto=format&fit=crop&w=600&q=80'},
{name:'फ्रेश लेमन सोडा',category:'सोडा/कोल्डड्रिंक्स',price:30,img:'https://images.unsplash.com/photo-1622483767028-3f66f32aef97?auto=format&fit=crop&w=600&q=80'}];
let products=JSON.parse(localStorage.getItem('carnival_products'))||defaultProducts;
function login(){if(document.getElementById('pass').value==='1234'){sessionStorage.setItem('carnival_admin','1');showPanel()}else alert('चुकीचा पासवर्ड!')}
function showPanel(){document.getElementById('login').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');render()}
function logout(){sessionStorage.removeItem('carnival_admin');location.reload()}
function render(){document.getElementById('list').innerHTML=products.length?products.map((p,i)=>'<div class="item"><span>'+p.name+'<br>₹'+p.price+' · '+p.category+'</span><button class="del" onclick="del('+i+')">काढा</button></div>').join(''):'<p class="note">अजून पदार्थ नाहीत.</p>'}
function del(i){if(confirm('हा पदार्थ काढायचा आहे का?')){products.splice(i,1);localStorage.setItem('carnival_products',JSON.stringify(products));render()}}
function addProduct(){
 const name=document.getElementById('name').value.trim(),cat=document.getElementById('cat').value,price=Number(document.getElementById('price').value),file=document.getElementById('img').files[0];
 if(!name||!price){alert('नाव आणि किंमत भरा.');return}
 const save=img=>{products.push({name,category:cat,price,img});localStorage.setItem('carnival_products',JSON.stringify(products));document.getElementById('name').value='';document.getElementById('price').value='';document.getElementById('img').value='';render();alert('पदार्थ मेनूमध्ये जोडला.')}
 if(file){const r=new FileReader();r.onload=e=>save(e.target.result);r.readAsDataURL(file)}else save(defaultProducts[0].img)
}
if(sessionStorage.getItem('carnival_admin')==='1')showPanel();
</script>
</body>
</html>
