<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carnival Ice Cream — Admin Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700;800&family=Rozha+One&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Mukta,sans-serif;background:#fff5f7;color:#252525}
body{max-width:430px;margin:auto;background:linear-gradient(160deg,#fff7fa,#fff0f4);min-height:100vh}
.wrap{padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
.brand{font-family:'Rozha One',serif;font-size:30px;line-height:1;color:#fff}
.head{background:linear-gradient(135deg,#e11d48,#ec4899,#f59e0b);border-radius:0 0 28px 28px;padding:22px 18px 20px;box-shadow:0 10px 28px #e11d4825}
.card{background:#fff;border:1px solid #fce7f3;border-radius:24px;padding:16px;margin-top:14px;box-shadow:0 8px 24px #9f123912}
input,select{width:100%;padding:12px 13px;border:1px solid #e5e7eb;border-radius:14px;background:#fafafa;font:inherit;margin-top:8px;outline:none}
input:focus,select:focus{border-color:#e11d48;background:#fff}
button{border:0;border-radius:15px;padding:12px 14px;font:700 14px Mukta,sans-serif;cursor:pointer;transition:transform 0.1s ease}
button:active{transform:scale(0.98)}
.primary{width:100%;background:#e11d48;color:#fff;margin-top:12px}
.primary:hover{background:#be123c}
.secondary{background:#f3f4f6;color:#4b5563}
.hidden{display:none!important}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;background:#fafafa;border:1px solid #f1f5f9;border-radius:16px;margin-top:8px}
.item span{font-size:13px;font-weight:700;line-height:1.25}
.del{background:#ffe4e6;color:#e11d48;padding:8px 12px;font-size:12px;border-radius:12px}
.note{font-size:11px;color:#6b7280;line-height:1.5}
.back{display:block;text-align:center;margin-top:14px;color:#e11d48;text-decoration:none;font-weight:800;font-size:13px}
</style>
</head>
<body>

<!-- Login View -->
<div id="login" class="wrap">
  <div class="head">
    <div class="brand">Carnival Ice Cream</div>
    <div style="color:#ffe4e6;font-weight:700;margin-top:5px">🔐 व्यवस्थापक विभाग</div>
  </div>
  <div class="card">
    <h2 style="margin:0 0 4px">Admin Login</h2>
    <p class="note">पासवर्ड टाकून मेनू व्यवस्थापन सुरू करा.</p>
    <input id="pass" type="password" placeholder="Admin पासवर्ड (1234)" autocomplete="current-password">
    <button class="primary" onclick="login()">लॉगइन करा</button>
    <p id="login-msg" class="note" style="color:#e11d48;text-align:center;margin-top:8px;margin-bottom:0"></p>
  </div>
  <a class="back" href="./index.html">← ग्राहक मेनूकडे जा</a>
</div>

<!-- Dashboard View -->
<div id="panel" class="wrap hidden">
  <div class="head">
    <div class="brand">Carnival Ice Cream</div>
    <div style="color:#fff1f2;font-weight:700;margin-top:5px">⚙️ Menu Management</div>
  </div>
  
  <div class="card">
    <h2 style="margin:0">नवीन पदार्थ जोडा 🍨</h2>
    <input id="name" placeholder="पदार्थाचे नाव (उदा. मलाई कुल्फी)">
    <select id="cat">
      <option value="आईस्क्रीम">आईस्क्रीम</option>
      <option value="मिल्कशेख">मिल्कशेख</option>
      <option value="लस्सी">लस्सी</option>
      <option value="सोडा/कोल्डड्रिंक्स">सोडा/कोल्डड्रिंक्स</option>
    </select>
    <input id="price" type="number" min="1" placeholder="किंमत ₹">
    <input id="img" type="file" accept="image/*">
    <p class="note">गॅलरीतून फोटो निवडा (नसल्यास डीफॉल्ट फोटो आपोआप बसेल).</p>
    <button class="primary" id="add-btn" onclick="addProduct()">मेनूमध्ये जोडा</button>
  </div>

  <div class="card">
    <h3 style="margin:0 0 6px">सध्या उपलब्ध मेनू</h3>
    <div id="list">डेटा लोड होत आहे...</div>
  </div>

  <button class="secondary" style="width:100%;margin-top:14px" onclick="logout()">लॉगआउट</button>
  <a class="back" href="./index.html">← ग्राहक मेनूकडे जा</a>
</div>

<!-- फक्त Firestore लायब्ररी (Storage आणि Auth ची गरज नाही) -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script>
// अचूक Firebase कॉन्फिगरेशन
const firebaseConfig = {
  apiKey: "AIzaSyD6v_dLiM5rbNBYmQL2rYMUH5v56B6KKew",
  authDomain: "carnival-ice-cream.firebaseapp.com",
  projectId: "carnival-ice-cream",
  storageBucket: "carnival-ice-cream.firebasestorage.app",
  messagingSenderId: "865814345062",
  appId: "1:865814345062:web:b9483f4e3540ae4f6744a7"
};

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}
const db = firebase.firestore();
const ADMIN_PASSWORD = "1234";
const defaultImg = "https://images.unsplash.com/photo-1563805042-7684c019e1cb?auto=format&fit=crop&w=600&q=80";
let unsubscribe = null;

function login() {
    if (document.getElementById('pass').value === ADMIN_PASSWORD) {
        sessionStorage.setItem('carnival_admin', '1');
        showPanel();
    } else {
        document.getElementById('login-msg').textContent = '❌ पासवर्ड चुकीचा आहे.';
    }
}

function logout() {
    sessionStorage.removeItem('carnival_admin');
    if (unsubscribe) unsubscribe();
    showLogin();
}

function showLogin() {
    document.getElementById('login').classList.remove('hidden');
    document.getElementById('panel').classList.add('hidden');
    document.getElementById('pass').value = '';
    document.getElementById('login-msg').textContent = '';
}

function showPanel() {
    document.getElementById('login').classList.add('hidden');
    document.getElementById('panel').classList.remove('hidden');
    listenProducts();
}

// Firestore मधून रिअल-टाइम डेटा वाचणे
function listenProducts() {
    if (unsubscribe) unsubscribe();
    unsubscribe = db.collection('products').orderBy('createdAt', 'desc').onSnapshot(s => {
        render(s.docs.map(d => ({ id: d.id, ...d.data() })));
    }, e => {
        console.error("Firestore Error:", e);
        document.getElementById('list').innerHTML = '<p class="note" style="color:#e11d48">मेनू लोड करता आला नाही. Rules तपासा.</p>';
    });
}

function esc(v) {
    return String(v ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
}

function render(products) {
    document.getElementById('list').innerHTML = products.length ? products.map(p => `
        <div class="item">
            <div style="display:flex;align-items:center;gap:10px;min-width:0">
                <img src="${esc(p.img || defaultImg)}" style="width:46px;height:46px;object-fit:cover;border-radius:12px;background:#fce7f3">
                <span>${esc(p.name)}<br><small style="color:#e11d48">₹${Number(p.price || 0)} · ${esc(p.category)}</small></span>
            </div>
            <button class="del" onclick="delProduct('${esc(p.id)}')">काढा</button>
        </div>
    `).join('') : '<p class="note">मेनूमध्ये अजून पदार्थ नाहीत.</p>';
}

async function delProduct(id) {
    if (!confirm('हा पदार्थ कायमचा काढायचा आहे का?')) return;
    try {
        await db.collection('products').doc(id).delete();
        alert('पदार्थ मेनूमधून काढला.');
    } catch (e) {
        alert('त्रुटी: ' + e.message);
    }
}

// फोटोचा आकार आपोआप लहान (Compress) करून Base64 बनवणे
function compressImage(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
            const img = new Image();
            img.src = event.target.result;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const maxDim = 500; // मोबाईल मेनूसाठी परिपूर्ण साईज
                let width = img.width;
                let height = img.height;

                if (width > height) {
                    if (width > maxDim) {
                        height = Math.round((height * maxDim) / width);
                        width = maxDim;
                    }
                } else {
                    if (height > maxDim) {
                        width = Math.round((width * maxDim) / height);
                        height = maxDim;
                    }
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                // कमी साईजमध्ये उत्तम स्पष्टता (0.75 Quality)
                resolve(canvas.toDataURL('image/jpeg', 0.75));
            };
            img.onerror = error => reject(error);
        };
        reader.onerror = error => reject(error);
    });
}

// नवीन पदार्थ Firestore मध्ये सेव्ह करणे
async function addProduct() {
    const name = document.getElementById('name').value.trim();
    const cat = document.getElementById('cat').value;
    const price = Number(document.getElementById('price').value);
    const file = document.getElementById('img').files[0];
    const btn = document.getElementById('add-btn');

    if (!name || !price) {
        alert('कृपया नाव आणि किंमत भरा.');
        return;
    }

    btn.disabled = true;
    btn.textContent = 'सेव्ह करत आहे...';

    try {
        let img = defaultImg;
        if (file) {
            btn.textContent = 'फोटो लहान करत आहे...';
            img = await compressImage(file);
        }

        btn.textContent = 'डेटाबेसमध्ये जोडत आहे...';
        await db.collection('products').add({
            name: name,
            category: cat,
            price: price,
            img: img,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        document.getElementById('name').value = '';
        document.getElementById('price').value = '';
        document.getElementById('img').value = '';
        alert('✅ पदार्थ मेनूमध्ये यशस्वीरित्या जोडला गेला!');
    } catch (e) {
        console.error('Save error:', e);
        alert('❌ त्रुटी: ' + (e.message || 'काहीतरी चूक झाली.'));
    } finally {
        btn.disabled = false;
        btn.textContent = 'मेनूमध्ये जोडा';
    }
}

if (sessionStorage.getItem('carnival_admin') === '1') {
    showPanel();
} else {
    showLogin();
}
</script>
</body>
</html>
